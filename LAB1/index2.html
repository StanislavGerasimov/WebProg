<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Квітка з мудрими порадами</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        margin: 0;
      }
      .flower {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .petal {
        position: absolute;
        width: 100px;
        height: 200px;
        background-color: red;
        border-radius: 50%;
        transform-origin: center bottom;
        cursor: pointer;
      }
      .petal:nth-child(1) {
        background-color: red;
        transform: rotate(0deg) translateY(-50%);
      }
      .petal:nth-child(2) {
        background-color: blue;
        transform: rotate(51deg) translateY(-50%);
      }
      .petal:nth-child(3) {
        background-color: green;
        transform: rotate(102deg) translateY(-50%);
      }
      .petal:nth-child(4) {
        background-color: yellow;
        transform: rotate(153deg) translateY(-50%);
      }
      .petal:nth-child(5) {
        background-color: purple;
        transform: rotate(204deg) translateY(-50%);
      }
      .petal:nth-child(6) {
        background-color: pink;
        transform: rotate(255deg) translateY(-50%);
      }
      .petal:nth-child(7) {
        background-color: orange;
        transform: rotate(306deg) translateY(-50%);
      }
      .center {
        position: absolute;
        top: 225px;
        width: 50px;
        height: 50px;
        background-color: yellow;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="flower">
      <div
        class="petal"
        onclick="window.location.href='https://vseosvita.ua/blogs/tsikavi-ta-nadykhaiuchi-tsytaty-vidomykh-liudei-81607.html'"

      <div

      ></div>

      <div

        onclick="window.location.href='https://vseosvita.ua/blogs/tsikavi-ta-nadykhaiuchi-tsytaty-vidomykh-liudei-81607.html'"

      <div class="center">Центр</div>
    </div>
  </body>
</html>
